{% extends "base.html" %}
{% block title %}Login — LoP Gaming Hub{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to continue your run.</p>
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
      </div>
      <label class="form-check">
        <input type="checkbox" name="remember" value="1"> Remember me
      </label>
      <button class="btn btn-primary btn-block" type="submit">Log In</button>
    </form>
    <p class="auth-alt">No account yet? <a href="{{ url_for('auth.register') }}">Sign up free</a> and grab your {{ trial_days }}-day trial.</p>
  </div>
</div>
{% endblock %}
